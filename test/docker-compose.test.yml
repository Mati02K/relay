# Override file for running the integration test suite.
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml run test-runner

services:
  test-runner:
    image: python:3.12-slim
    networks:
      - management
    depends_on:
      - worker-1
      - worker-2
    command:
      - sh
      - -c
      - |
        pip install --quiet httpx
        python - <<'PYEOF'
        import httpx, time, sys

        WORKER = "http://worker-1:9090"

        print("Waiting for a coordinator to be elected...")
        for i in range(20):
            try:
                r = httpx.get(f"{WORKER}/health", timeout=3)
                if r.status_code == 200:
                    print("Worker healthy:", r.json())
                    break
            except Exception:
                pass
            time.sleep(2)
        else:
            print("FAIL: worker did not become healthy")
            sys.exit(1)

        # Wait until coordinator is elected (worker health shows coordinatorUrl)
        for i in range(20):
            r = httpx.get(f"{WORKER}/health", timeout=3)
            if r.json().get("coordinatorUrl"):
                print("Coordinator elected:", r.json()["coordinatorUrl"])
                break
            time.sleep(2)
        else:
            print("FAIL: no coordinator elected")
            sys.exit(1)

        # Test 1: store a message via worker-1
        r = httpx.post(
            f"{WORKER}/v1/chat",
            json={"messages": [{"role": "user", "content": "hello relay"}]},
            timeout=10,
        )
        assert r.status_code == 200, f"Expected 200, got {r.status_code}: {r.text}"
        body = r.json()
        assert body["stored"] is True
        msgId = body["id"]
        print("PASS: message stored via worker-1, id =", msgId)

        # Test 2: retrieve via worker-2 (different worker, same coordinator)
        WORKER2 = "http://worker-2:9090"
        r2 = httpx.get(f"{WORKER2}/v1/messages", timeout=10)
        assert r2.status_code == 200
        msgs = r2.json()
        assert msgId in msgs, f"Expected {msgId} in {list(msgs.keys())}"
        print("PASS: message retrievable via worker-2")

        print("ALL TESTS PASSED")
        PYEOF
