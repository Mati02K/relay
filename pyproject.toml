[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "grpcio>=1.64",
    "grpcio-tools>=1.64",
    "protobuf>=5.0",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
    "zeroconf>=0.132",
    "pydantic>=2.7",
    "loguru>=0.7",
]

[project.scripts]
relay = "relay.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "uv>=0.4",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
membership = [
    "etcd-go/go.mod",
    "etcd-go/go.sum",
    "etcd-go/main.go",
    "etcd-go/membership/*.go",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# N (pep8-naming) intentionally excluded — project uses camelCase for methods and variables.
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/membership/relay_pb2.*\\.py"]
